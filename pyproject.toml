[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cubetrack"
version = "0.0.1"
description = "Vision-based Rubik's Cube tracker"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "foundation: camera-free cube mathematics checks (Milestones 1-2)",
]
